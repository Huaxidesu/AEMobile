# 打 tag 就构建并发布到 GitHub Release。
#
# 构建环境交给 GTNH 官方的可复用 workflow：ForgeGradle 1.2 在 GitHub Actions 上有一堆环境坑
# （最典型的是 `:applyBinPatches` 报 CrashReport 的 checksum 不匹配），自己拼 steps 反复踩不划算，
# 官方那份每天在跑，JDK/toolchain/缓存都配好了。GTNH 官方示例模组也是这么写的。
#
# 版本号由 build.gradle 的 git-version 插件从 tag 读，所以必须由 tag 触发。
name: Release

on:
  push:
    tags:
      - '*'
  # 手动补发用：Actions 页面选 tag 作为 ref 跑一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-tags:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/release-tags.yml@master
    secrets: inherit
